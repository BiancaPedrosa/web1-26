<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Pacientes - Clínica de Nutrição</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

  <h1>Clínica de Nutrição - Cadastro de Pacientes</h1>

  <form id="formPaciente">
    <label for="inputNome">Nome:</label>
    <input type="text" id="inputNome" required>

    <label for="inputPeso">Peso (kg):</label>
    <input type="number" id="inputPeso" step="0.1" min="1" required>

    <label for="inputAltura">Altura (m):</label>
    <input type="number" id="inputAltura" step="0.01" min="0.5" required>

    <!-- O texto do botão muda entre "Cadastrar" e "Salvar edição" pelo JS -->
    <button type="submit" id="btnEnviar">Cadastrar</button>
  </form>

  <table id="tabelaPacientes">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Peso (kg)</th>
        <th>Altura (m)</th>
        <th>IMC</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="corpoTabela">
      <!-- As linhas são criadas pelo JavaScript, a partir do array "pacientes" -->
    </tbody>
  </table>

  <script src="script.js"></script>
</body>
</html>
