<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido de Pizzas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>🍕 Pedido de Pizzas</h1>

    <form id="formPedido">

        <div class="grupo">
            <label for="quantidade">Quantidade de pizzas:</label>
            <input type="number" id="quantidade" min="1" placeholder="Digite a quantidade">
        </div>

        <div class="grupo">
            <h3>Tamanho da Pizza</h3>

            <label>
                <input type="radio" name="tamanho" value="25">
                Pequena - R$ 25,00
            </label>

            <label>
                <input type="radio" name="tamanho" value="35">
                Média - R$ 35,00
            </label>

            <label>
                <input type="radio" name="tamanho" value="45">
                Grande - R$ 45,00
            </label>
        </div>

        <div class="grupo">
            <h3>Adicionais</h3>

            <label>
                <input type="checkbox" class="adicional" value="8">
                Borda recheada (+R$ 8,00)
            </label>

            <label>
                <input type="checkbox" class="adicional" value="10">
                Refrigerante 2L (+R$ 10,00)
            </label>

            <label>
                <input type="checkbox" class="adicional" value="12">
                Sobremesa (+R$ 12,00)
            </label>
        </div>

        <div class="botoes">
            <button type="button" onclick="calcularPedido()">
                Calcular Pedido
            </button>

            <button type="reset" onclick="limparResultado()">
                Limpar
            </button>
        </div>

    </form>

    <div id="resultado">
        Total: R$ 0,00
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
